name: All Ears data integrity
on:
  push:
    paths:
      - 'poe-all-ears/**'
      - '.github/workflows/all-ears-validation.yml'
  pull_request:
    paths:
      - 'poe-all-ears/**'
      - '.github/workflows/all-ears-validation.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate dialogue and patch data
        run: node poe-all-ears/validate-data.cjs
      - name: Validate interface scripts and route wiring
        run: node poe-all-ears/validate-ui.cjs
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser automation runtime
        run: npm install --no-save --no-package-lock playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run real browser interaction smoke tests
        run: node poe-all-ears/test-browser.cjs
