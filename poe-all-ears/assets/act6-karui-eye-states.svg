<text x="589" y="282" font-family="Arial,sans-serif" font-size="16" fill="#eacbc1">Talk to the NPC first</text>
<text x="575" y="377" font-family="Arial,sans-serif" font-size="16" fill="#c9d8de">Steam 3.28 / Wiki 2025 source</text>
<text x="575" y="412" font-family="Arial,sans-serif" font-size="16" fill="#c5d4d9">Patch 3.30 NOT verified</text>
