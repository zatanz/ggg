<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="title desc">
<title id="title">The Father of War — illustrative quest state</title>
<desc id="desc">Original non-game conceptual diagram showing the pre-action dialogue order for The Father of War, not an in-game screenshot.</desc>
<defs><linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#19283c"/><stop offset="1" stop-color="#0c121e"/></linearGradient></defs>
<rect width="960" height="540" fill="url(#background)"/>
<rect x="20" y="20" width="920" height="500" rx="16" stroke="#b19462" stroke-width="2" fill="none"/>
<text x="49" y="66" font-family="Georgia,serif" font-size="29" fill="#f3d4a0" font-weight="bold">The Father of War</text>
<text x="50" y="96" font-family="Arial,sans-serif" font-size="18" fill="#c1cbd7">Eye of Conquest / Karui Fortress</text>
<rect x="49" y="126" width="485" height="324" rx="10" fill="#1f3041" stroke="#637c89"/>
<text x="69" y="170" font-family="Georgia,serif" font-size="24" fill="#eed8af">QUEST SEQUENCE</text>
