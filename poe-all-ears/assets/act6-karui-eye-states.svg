<text x="87" y="230" font-family="Arial,sans-serif" font-size="19" fill="#e8edf1">1. Use the Eye of Conquest</text>
<rect x="69" y="269" width="440" height="69" rx="9" fill="#365247" stroke="#b9c991" stroke-width="2"/>
<text x="87" y="309" font-family="Arial,sans-serif" font-size="19" font-weight="bold" fill="#ffefc0">2. Talk to Tarkleigh · #322</text>
<rect x="69" y="352" width="440" height="65" rx="9" fill="#304457"/>
<text x="87" y="392" font-family="Arial,sans-serif" font-size="19" fill="#e8edf1">3. Then enter Karui Fortress</text>
<rect x="553" y="126" width="359" height="324" rx="10" fill="#212b38" stroke="#637c89"/>
<text x="573" y="170" font-family="Georgia,serif" font-size="25" fill="#f2cb9c">STOP / CHECK</text>
